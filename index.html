<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ace's CS Portfolio</title>
  <style>
    :root {
      --red: #d52a3f;
      --blue: #314ece;
      --green: #45ba4b;
      --bg: #ffffff;
      --ink: #111111;
      --muted: #555555;
      --surface: #f7f7f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 2rem 1.25rem;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Retro 2000s Tri-Color Top Bar */
    .color-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 10px;
      border: 2px solid var(--ink);
      margin-bottom: 1.5rem;
    }
    .strip-red { background: var(--red); }
    .strip-blue { background: var(--blue); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); }
    .strip-green { background: var(--green); }

    header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .subtitle {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Filter Buttons */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .filter-btn {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.5rem 0.95rem;
      background: var(--bg);
      color: var(--ink);
      border: 2px solid var(--ink);
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.08s ease;
    }

    .filter-btn:hover {
      background: var(--surface);
    }

    .filter-btn.active[data-filter="All"] { background: var(--ink); color: #fff; }
    .filter-btn.active[data-filter="Sims"] { background: var(--blue); color: #fff; }
    .filter-btn.active[data-filter="Sites"] { background: var(--green); color: var(--ink); }
    .filter-btn.active[data-filter="Video Games"] { background: var(--red); color: #fff; }
    .filter-btn.active[data-filter="Other"] { background: var(--ink); color: #fff; }

    /* Project Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.25rem;
    }

    .card {
      border: 2px solid var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      padding: 1.25rem;
    }

    .badge {
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border: 1.5px solid var(--ink);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .badge-Sims { background: var(--blue); color: #fff; }
    .badge-Sites { background: var(--green); color: var(--ink); }
    .badge-Video-Games { background: var(--red); color: #fff; }
    .badge-Other { background: var(--surface); color: var(--ink); }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .card-link {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.65rem;
      border-top: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
    }

    .card-link:hover {
      background: var(--blue);
      color: #fff;
    }

    .card-link.disabled {
      color: #888;
      pointer-events: none;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="color-strip">
      <div class="strip-red"></div>
      <div class="strip-blue"></div>
      <div class="strip-green"></div>
    </div>

    <header>
      <div>
        <h1>Ace's CS Portfolio</h1>
        <p class="subtitle">// Simulations, Websites, Games &amp; Experiments</p>
      </div>
      <p class="subtitle" id="project-count">Showing 0 projects</p>
    </header>

    <nav class="filter-bar" aria-label="Project Categories">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Sims">Sims</button>
      <button class="filter-btn" data-filter="Sites">Sites</button>
      <button class="filter-btn" data-filter="Video Games">Video Games</button>
      <button class="filter-btn" data-filter="Other">Other</button>
    </nav>

    <main class="grid" id="portfolio-grid"></main>

    <footer>
      <span>ACE'S CS PORTFOLIO</span>
      <span>EST. 2000s STYLE</span>
    </footer>
  </div>

  <script>
    // ==========================================
    // ADD YOUR NEW PROJECTS TO THIS LIST!
    // Categories: "Sims", "Sites", "Video Games", "Other"
    // ==========================================
    const projects = [
      {
        title: "Simulation 01",
        category: "Sims",
        description: "My first interactive computer science simulation.",
        url: "root-sim1.html",
        live: true
      },
      {
        title: "Web Project [Slot]",
        category: "Sites",
        description: "Future website build coming soon.",
        url: "#",
        live: false
      },
      {
        title: "Arcade Game [Slot]",
        category: "Video Games",
        description: "Future browser game coming soon.",
        url: "#",
        live: false
      },
      {
        title: "CS Tool / App [Slot]",
        category: "Other",
        description: "Future utility app or experiment coming soon.",
        url: "#",
        live: false
      }
    ];

    const grid = document.getElementById("portfolio-grid");
    const countLabel = document.getElementById("project-count");
    const buttons = document.querySelectorAll(".filter-btn");

    function renderProjects(filter = "All") {
      const filtered = filter === "All"
        ? projects
        : projects.filter(p => p.category === filter);

      countLabel.textContent = `Showing ${filtered.length} project${filtered.length === 1 ? "" : "s"}`;

      grid.innerHTML = filtered.map(project => {
        const badgeClass = `badge-${project.category.replace(/\s+/g, "-")}`;
        const linkHTML = project.live
          ? `<a class="card-link" href="${project.url}" target="_blank" rel="noopener noreferrer">LAUNCH PROJECT &rarr;</a>`
          : `<a class="card-link disabled" href="${project.url}" target="_blank" rel="noopener noreferrer">COMING SOON</a>`;

        return `
          <article class="card">
            <div class="card-top">
              <span class="badge ${badgeClass}">${project.category}</span>
              <h2>${project.title}</h2>
              <p>${project.description}</p>
            </div>
            ${linkHTML}
          </article>
        `;
      }).join("");
    }

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderProjects(btn.dataset.filter);
      });
    });

    renderProjects("All");
  </script>
</body>
</html>
